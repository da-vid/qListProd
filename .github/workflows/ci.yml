name: Modern qList checks
on:
  push:
    branches: ["codex/safe-development-baseline"]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify Java for the isolated database emulator
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
      - run: npm run test:emulator
      - run: npm run test:staging-rules
      - run: npm run test:candidate-rules
      - run: npm run test:production-rules
      - run: npm run test:migration
      - run: npm run test:release-ui
      - run: npm run build:staging && npm run test:staging-build
      - run: npm run build:release && npm run test:release-build
