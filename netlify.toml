[build]
  command = "npm run check && npm run build:staging && npm run test:staging-build"
  publish = "dist-staging"

[build.environment]
  NODE_VERSION = "24.21.0"
  NPM_VERSION = "11.16.0"

# This is a preview-only baseline. Production rollout needs a separate reviewed change.
[context.production]
  command = "node scripts/reject-production.mjs"
